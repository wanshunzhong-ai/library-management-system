<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理员登录 · {{ library_name }}</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="/static/css/site.css" />
  <link rel="stylesheet" href="/static/css/login.css" />
</head>
<body class="login-body">
  <div class="login-shell">
    <aside class="login-aside">
      <a class="brand brand-light" href="/">
        <span class="brand-mark">图</span>
        <span class="brand-text">
          <strong>{{ library_name }}</strong>
          <small>LIBRARY PORTAL</small>
        </span>
      </a>
      <div class="aside-body">
        <h2>后台管理控制台</h2>
        <p>图书编目、读者档案与借阅流通的日常业务，均在此完成。</p>
        <ul class="aside-list">
          <li><span>▤</span>图书与馆藏库存维护</li>
          <li><span>◍</span>读者证与借阅权限管理</li>
          <li><span>⇄</span>借书、还书与续借办理</li>
          <li><span>▦</span>流通数据与逾期统计</li>
        </ul>
      </div>
      <div class="aside-note">本系统仅供馆内工作人员使用，操作将被记录。</div>
    </aside>

    <main class="login-main">
      <form class="login-card" id="loginForm" novalidate>
        <h1>登录</h1>
        <p class="login-sub">请使用管理员账号登录后台</p>

        <div class="field" id="fieldUsername">
          <label for="username">用户名</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入用户名" />
        </div>

        <div class="field" id="fieldPassword">
          <label for="password">密码</label>
          <div class="pw-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" />
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="显示密码">显示</button>
          </div>
        </div>

        <div class="login-error" id="loginError" hidden></div>

        <button class="btn btn-primary btn-block" type="submit" id="loginBtn">登录后台</button>

        <div class="login-hint" id="loginHint">
          <b>首次使用？</b> 默认账号 <code>admin</code> / <code>admin123</code>，登录后请立即修改密码。
        </div>

        <a class="back-link" href="/">← 返回读者门户</a>
      </form>
    </main>
  </div>

  <script src="/static/js/login.js"></script>
</body>
</html>
